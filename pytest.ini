[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=vnpy.chart
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=95
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    qt: Tests requiring Qt application
    no_qt: Tests that don't require Qt (will skip pytest-qt plugin)

