[pytest]
# pytest配置文件

# 测试文件匹配模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试路径
testpaths = vnpy_datamanager/tests

# 输出选项
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    ui: UI相关测试
    engine: 引擎相关测试
    slow: 运行较慢的测试

# 日志配置
log_cli = false
log_cli_level = INFO

# 覆盖率配置（需要pytest-cov）
# [tool.coverage.run]
# source = vnpy_datamanager
# omit = 
#     */tests/*
#     */__pycache__/*

